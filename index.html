/* ===== MATCHDAY VAULT V5 — premium mobile command centre ===== */
:root{
  --v5-card:#0d1420;
  --v5-card2:#111b2a;
  --v5-line:#223149;
  --v5-muted:#8492aa;
  --v5-gold:#ffd36a;
}
body{background:
  radial-gradient(800px 460px at 18% -8%,rgba(255,211,106,.13),transparent 58%),
  radial-gradient(700px 520px at 100% 12%,rgba(66,125,255,.08),transparent 58%),
  #070b11}
.topbar{position:sticky;top:0;z-index:20;margin:0 -20px 18px;padding:12px 20px;background:rgba(7,11,17,.82);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.055)}
.brandmark{font-weight:950;letter-spacing:-.06em;background:linear-gradient(145deg,#ffe9a8,#e2a731);box-shadow:0 10px 30px rgba(255,211,106,.18)}
.v5-dashboard-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:14px;margin-bottom:14px}
.v5-welcome,.nextup-card{border:1px solid var(--v5-line);border-radius:26px;position:relative;overflow:hidden;box-shadow:0 20px 55px rgba(0,0,0,.20)}
.v5-welcome{padding:24px;background:linear-gradient(135deg,#121b2a 0%,#0b111b 62%,#15120c 100%)}
.v5-welcome:after{content:"";position:absolute;right:-80px;top:-120px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,211,106,.19),transparent 66%)}
.v5-welcome h2{font-size:clamp(29px,4vw,46px);line-height:.98;letter-spacing:-.055em;margin:8px 0 10px;max-width:670px}
.v5-welcome p{font-size:13px;line-height:1.55;color:var(--muted);max-width:610px;margin:0}
.v5-hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.nextup-card{padding:18px;background:linear-gradient(155deg,#101a29,#0a1019);display:flex;flex-direction:column;justify-content:space-between;min-height:210px}
.nextup-label{font-size:9px;letter-spacing:.16em;color:var(--v5-gold);font-weight:900;text-transform:uppercase}
.nextup-clubs{display:flex;align-items:center;gap:12px;margin-top:14px}
.v5-crest{width:54px;height:62px;display:grid;place-items:center;flex:0 0 auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.v5-crest.small{width:38px;height:44px}
.v5-crest svg{width:100%;height:100%;display:block}
.nextup-main{min-width:0}
.nextup-main h3{font-size:19px;line-height:1.12;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextup-meta{font-size:11px;color:var(--muted);line-height:1.45}
.nextup-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:13px;border-top:1px solid var(--v5-line)}
.countdown{font-size:11px;font-weight:850;color:#fff}
.v5-club-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:14px}
.v5-club{border:1px solid var(--v5-line);border-radius:22px;background:linear-gradient(145deg,#101825,#0a1018);padding:15px;position:relative;overflow:hidden;cursor:pointer;transition:.18s}
.v5-club:hover{transform:translateY(-2px);border-color:#344866}
.v5-club:after{content:"";position:absolute;right:-70px;top:-80px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--club-glow),transparent 68%)}
.v5-club-head{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.v5-club-title{display:flex;align-items:center;gap:10px}
.v5-club-title h3{font-size:15px;margin:0}.v5-open{font-size:9px;font-weight:900;color:var(--muted);letter-spacing:.06em}
.v5-club-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;position:relative;z-index:1}
.v5-club-stat{padding:9px;border:1px solid rgba(255,255,255,.055);border-radius:12px;background:rgba(6,10,16,.34)}
.v5-club-stat b{display:block;font-size:16px}.v5-club-stat span{display:block;font-size:8px;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.v5-section-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}
.v5-panel{border:1px solid var(--v5-line);background:linear-gradient(180deg,#0d1520,#090f17);border-radius:22px;padding:15px}
.v5-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.v5-panel-head h3{font-size:15px;margin:0}.v5-panel-head p{font-size:10px;color:var(--muted);margin:3px 0 0}
.fixture-stack{display:flex;flex-direction:column;gap:8px}
.fixture-row{display:grid;grid-template-columns:46px 42px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #1d2a3e;background:#0a111b;border-radius:15px;padding:9px;cursor:pointer}
.fixture-row:hover{border-color:#324560}
.fixture-date{text-align:center;border-right:1px solid #213047;padding-right:8px}.fixture-date b{display:block;font-size:17px}.fixture-date span{font-size:8px;text-transform:uppercase;color:var(--soft);letter-spacing:.08em}
.fixture-info{min-width:0}.fixture-info b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fixture-info span{display:block;font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<div id="toast-root"></div>

<div id="install-banner" class="install-banner" role="region" aria-label="Install Matchday Vault">
  <div class="install-icon">🎟️</div>
  <div class="install-copy"><b>Install Matchday Vault</b><span>Add it to your home screen and use it fullscreen like an app.</span></div>
  <div class="install-actions"><button class="btn" onclick="dismissInstall()"><span class="dismiss-label">Not now</span><span class="dismiss-label" style="display:none">×</span></button><button class="btn primary" onclick="installApp()">Install</button></div>
</div>

<script>
const STORE_KEY='matchday-vault-v3';
const RECOVERY_KEY='matchday-vault-v3-recovery';
const META_KEY='matchday-vault-v3-meta';
const CLUBS=[
 {id:'arsenal',name:'Arsenal',short:'ARS',color:'#e30613',secondary:'#f4d58d',icon:'A',portal:'https://www.arsenal.com/'},
 {id:'manutd',name:'Manchester United',short:'MUN',color:'#da291c',secondary:'#fbe122',icon:'U',portal:'https://www.manutd.com/'},
 {id:'liverpool',name:'Liverpool',short:'LIV',color:'#c8102e',secondary:'#00b2a9',icon:'L',portal:'https://www.liverpoolfc.com/'}
];
let state={clubs:structuredClone(CLUBS),tickets:[],memberships:[],buyers:[],settings:{currency:'GBP'}};
let view='dashboard',clubFilter='all',clubTab='tickets',searchText='',ticketStatus='all',pendingFiles=[];
const $=s=>document.querySelector(s);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(v){const n=Number(v||0);return new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n)}
function fmtDate(v){if(!v)return'—';const d=new Date(v+'T00:00:00');return isNaN(d)?v:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function fmtShort(v){if(!v)return'—';const d=new Date(v+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function club(id){return state.clubs.find(c=>c.id===id)||CLUBS.find(c=>c.id===id)||{name:'Unknown',color:'#777',icon:'?'}}
function buyer(id){return state.buyers.find(b=>b.id===id)}
function safeUrl(v){if(!v)return'';try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}}
function save(){
  try{
    const previous=localStorage.getItem(STORE_KEY);
    if(previous) localStorage.setItem(RECOVERY_KEY,previous);
    localStorage.setItem(STORE_KEY,JSON.stringify(state));
    localStorage.setItem(META_KEY,JSON.stringify({lastSaved:new Date().toISOString(),version:'6.0'}));
    toast('Saved securely on this device');
  }catch(e){console.error(e);alert('Matchday could not save. Export a secure backup before closing the app.');}
}
function hydrate(x){
  state={...state,...x};
  state.clubs=CLUBS.map(base=>({...base,...((x.clubs||[]).find(c=>c.id===base.id)||{})}));
}
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) hydrate(JSON.parse(raw));
  }catch(e){
    console.error(e);
    try{
      const recovery=localStorage.getItem(RECOVERY_KEY);
      if(recovery){hydrate(JSON.parse(recovery));setTimeout(()=>toast('Recovered your previous local copy'),300)}
    }catch(_){}
  }
  render();
}
function toast(msg){const root=$('#toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>{root.innerHTML=''},1800)}
function totals(){let invested=0,revenue=0,soldCost=0,unsold=0;state.memberships.forEach(m=>invested+=Number(m.cost||0));state.tickets.forEach(t=>{const c=Number(t.costPrice||0);invested+=c;if(t.status==='sold'||t.status==='sent'||t.status==='used'){revenue+=Number(t.salePrice||0);soldCost+=c}else unsold+=c});return{invested,revenue,profit:revenue-soldCost,unsold,count:state.tickets.length,sold:state.tickets.filter(t=>['sold','sent','used'].includes(t.status)).length}}
function navItem(id,ico,label,count=''){return `<button class="navbtn ${view===id?'active':''}" onclick="setView('${id}')"><span class="navico">${ico}</span><span>${label}</span>${count!==''?`<span class="pillcount">${count}</span>`:''}</button>`}
function render(){const t=totals();$('#app').innerHTML=`
<div class="topbar"><div class="brand"><div class="brandmark">🎟</div><div><h1>Matchday Vault</h1><p>Tickets, memberships, buyers and profit — all in one place.</p></div></div><div class="top-actions"><button class="btn secondary-hide" onclick="openBackupCenter()">🔐 Backup</button><button class="btn primary" onclick="openQuickAdd()">+ Add</button></div></div>
<div class="layout"><aside class="sidebar"><div class="sidebox"><div class="navlabel">Workspace</div>${navItem('dashboard','⌂','Dashboard')}${navItem('inventory','🎟','Inventory',state.tickets.length)}${navItem('buyers','◎','Buyers',state.buyers.length)}${navItem('memberships','◇','Memberships',state.memberships.length)}${navItem('analytics','↗','Analytics')}<div class="navlabel">Clubs</div>${state.clubs.map(c=>`<button class="navbtn ${view==='club'&&clubFilter===c.id?'active':''}" onclick="openClub('${c.id}')"><span class="club-dot" style="background:${c.color}"></span><span>${esc(c.name)}</span><span class="pillcount">${state.tickets.filter(t=>t.clubId===c.id).length}</span></button>`).join('')}<div class="sidefooter"><button class="navbtn" onclick="openBackupCenter()"><span class="navico">🔐</span>Backup & recovery</button></div></div></aside><main class="main">${renderMain(t)}</main></div>
<button class="fab" onclick="openQuickAdd()">+</button><div class="mobilebar">${mobileNav()}</div>`}
function mobileNav(){return[['dashboard','⌂','Home'],['inventory','🎟','Tickets'],['memberships','◇','Members'],['buyers','◎','Buyers'],['analytics','↗','Stats']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="setView('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
function renderMain(t){if(view==='inventory')return inventoryView();if(view==='buyers')return buyersView();if(view==='memberships')return membershipsView();if(view==='analytics')return analyticsView();if(view==='club')return clubView();return dashboardView(t)}
function dashboardView(t){const upcoming=[...state.tickets].filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);const recent=[...state.tickets].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,5);return `
<section class="hero"><div class="eyebrow">Command centre</div><h2>Your matchday business at a glance.</h2><p>Track what you own, who you sold to, what still needs sending, membership accounts, ticket links and the money tied up in stock.</p><div class="hero-actions"><button class="btn primary" onclick="openTicketModal()">+ New ticket</button><button class="btn" onclick="openMembershipModal()">+ Membership</button><button class="btn" onclick="openBuyerModal()">+ Buyer</button></div></section>
<div class="kpis"><div class="kpi"><div class="label">Total invested</div><div class="value">${money(t.invested)}</div><div class="hint">Tickets + memberships</div></div><div class="kpi"><div class="label">Revenue</div><div class="value blue">${money(t.revenue)}</div><div class="hint">Sold / sent tickets</div></div><div class="kpi"><div class="label">Realised profit</div><div class="value ${t.profit>=0?'good':'bad'}">${money(t.profit)}</div><div class="hint">On completed sales</div></div><div class="kpi"><div class="label">Unsold stock</div><div class="value gold">${money(t.unsold)}</div><div class="hint">Cash tied up</div></div><div class="kpi"><div class="label">Tickets sold</div><div class="value">${t.sold}/${t.count}</div><div class="hint">Completed pipeline</div></div></div>
<div class="grid2"><section class="panel"><div class="panelhead"><div><h3>Upcoming schedule</h3><div class="subtle">Matches and tickets that need attention</div></div><button class="mini" onclick="setView('inventory')">View all</button></div>${upcoming.length?scheduleHtml(upcoming):empty('No fixtures added yet.')}</section><section class="panel"><div class="panelhead"><div><h3>Club exposure</h3><div class="subtle">Current inventory by club</div></div></div>${clubBars()}</section></div><section class="panel" style="margin-top:14px"><div class="panelhead"><div><h3>Recent inventory</h3><div class="subtle">Latest tickets added or updated</div></div></div>${recent.length?ticketTable(recent):empty('Add your first ticket to start the inventory.')}</section>`}
function scheduleHtml(items){return `<div class="schedule">${items.map(t=>{const c=club(t.clubId),d=new Date(t.date+'T00:00:00');return `<div class="sched"><div class="datebox"><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-GB',{month:'short'})}</span></div><div class="schedmain"><b>${esc(t.event||'Fixture')}</b><div><span style="color:${c.color}">${esc(c.name)}</span> · ${esc(t.kickoff||'TBC')} · ${esc(t.seat||'Seat TBC')}</div></div><div class="right"><span class="status ${esc(t.status||'available')}">${esc(labelStatus(t.status))}</span><div class="meta">${t.buyerId?esc(buyer(t.buyerId)?.name||'Buyer'): 'No buyer'}</div></div></div>`}).join('')}</div>`}
function clubBars(){const vals=state.clubs.map(c=>({c,n:state.tickets.filter(t=>t.clubId===c.id&&!['sold','sent','used'].includes(t.status)).length}));const max=Math.max(1,...vals.map(x=>x.n));return `<div class="barlist">${vals.map(x=>`<div class="barrow"><span>${esc(x.c.name)}</span><div class="bartrack"><div class="barfill" style="width:${x.n/max*100}%;background:${x.c.color}"></div></div><b>${x.n}</b></div>`).join('')}</div>`}
function ticketTable(items){return `<div class="tablewrap"><table><thead><tr><th>Fixture</th><th>Date</th><th>Seat</th><th>Status</th><th>Buyer</th><th>Payment</th><th>Cost</th><th>Sale</th><th>Profit</th><th>Link</th><th></th></tr></thead><tbody>${items.map(ticketRow).join('')}</tbody></table></div>`}
function ticketRow(t){const c=club(t.clubId),b=buyer(t.buyerId),profit=Number(t.salePrice||0)-Number(t.costPrice||0),u=safeUrl(t.ticketLink);return `<tr><td><div class="fixture">${esc(t.event||'Fixture')}</div><div class="meta"><span style="color:${c.color}">●</span> ${esc(c.name)}${t.competition?' · '+esc(t.competition):''}</div></td><td>${fmtDate(t.date)}<div class="meta">${esc(t.kickoff||'')}</div></td><td>${esc(t.seat||'—')}<div class="meta">${esc(t.block||'')}</div></td><td><span class="status ${esc(t.status||'available')}">${esc(labelStatus(t.status))}</span></td><td>${b?`<b>${esc(b.name)}</b><div class="meta">${esc(b.email||b.phone||'')}</div>`:'—'}</td><td><span class="status ${t.paymentStatus==='paid'?'paid':'unpaid'}">${esc(t.paymentStatus==='paid'?'Paid':'Unpaid')}</span></td><td>${money(t.costPrice)}</td><td>${t.salePrice?money(t.salePrice):'—'}</td><td class="${profit>=0?'good':'bad'}">${t.salePrice?money(profit):'—'}</td><td>${u?`<a class="linkbtn" href="${esc(u)}" target="_blank" rel="noopener">Open ↗</a>`:'—'}</td><td><div class="actions"><button class="mini" onclick="openTicketModal('${t.id}')">Edit</button><button class="mini" onclick="removeTicket('${t.id}')">×</button></div></td></tr>`}
function labelStatus(s){return({available:'Available',reserved:'Reserved',awaiting:'Awaiting payment',sent:'Sent',sold:'Sold',used:'Used'}[s]||'Available')}
function inventoryView(){let items=[...state.tickets];if(clubFilter!=='all')items=items.filter(t=>t.clubId===clubFilter);if(ticketStatus!=='all')items=items.filter(t=>t.status===ticketStatus);if(searchText){const q=searchText.toLowerCase();items=items.filter(t=>JSON.stringify(t).toLowerCase().includes(q)||(buyer(t.buyerId)?.name||'').toLowerCase().includes(q)||club(t.clubId).name.toLowerCase().includes(q))}items.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return `<section class="hero"><div class="eyebrow">Inventory</div><h2>Every ticket. Every buyer. Every link.</h2><p>Use filters to find unsold stock, sold tickets, buyer records or a specific fixture instantly.</p></section><section class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input placeholder="Search fixture, buyer, seat, notes…" value="${esc(searchText)}" oninput="searchText=this.value;render()"></div><select class="filter" onchange="clubFilter=this.value;render()"><option value="all">All clubs</option>${state.clubs.map(c=>`<option value="${c.id}" ${clubFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select class="filter" onchange="ticketStatus=this.value;render()"><option value="all">All statuses</option>${['available','reserved','awaiting','sent','sold','used'].map(s=>`<option value="${s}" ${ticketStatus===s?'selected':''}>${labelStatus(s)}</option>`).join('')}</select><button class="btn primary" onclick="openTicketModal()">+ Ticket</button></div>${items.length?ticketTable(items):empty('No tickets match these filters.')}</section>`}
function membershipsView(filterClub){const items=state.memberships.filter(m=>!filterClub||m.clubId===filterClub);return `<section class="hero"><div class="eyebrow">Membership vault</div><h2>Keep every membership account organised.</h2><p>Store membership number, login email, tier, renewal date, portal link and notes without hunting through messages.</p><div class="hero-actions"><button class="btn primary" onclick="openMembershipModal()">+ Add membership</button></div></section>${items.length?`<div class="cards">${items.map(membershipCard).join('')}</div>`:empty('No memberships added yet.')}`}
function membershipCard(m){const c=club(m.clubId),u=safeUrl(m.portalLink||c.portal);return `<article class="card" style="--card-accent:${c.color}"><div class="club-badge"><span class="club-dot" style="background:${c.color}"></span>${esc(c.name)}</div><h4>${esc(m.type||'Membership')}</h4><div class="small">${esc(m.memberNumber||'No membership number')}</div><div style="margin-top:13px" class="small"><b style="color:var(--text)">${esc(m.email||'No login email')}</b><br>${esc(m.tier||'Tier not specified')} · Renews ${fmtDate(m.renewalDate)}</div><div class="moneyline"><div class="moneybox"><span>Cost</span><b>${money(m.cost)}</b></div><div class="actions">${u?`<a class="mini" style="text-decoration:none" href="${esc(u)}" target="_blank" rel="noopener">Portal ↗</a>`:''}<button class="mini" onclick="openMembershipModal('${m.id}')">Edit</button><button class="mini" onclick="removeMembership('${m.id}')">×</button></div></div>${m.notes?`<div class="meta" style="margin-top:10px">${esc(m.notes)}</div>`:''}</article>`}
function buyersView(){return `<section class="hero"><div class="eyebrow">Buyer CRM</div><h2>Know exactly who you sold to.</h2><p>Each buyer keeps their contact details and automatically links back to every ticket they purchased.</p><div class="hero-actions"><button class="btn primary" onclick="openBuyerModal()">+ Add buyer</button></div></section>${state.buyers.length?`<div class="buyergrid">${state.buyers.map(buyerCard).join('')}</div>`:empty('No buyers saved yet.')}`}
function buyerCard(b){const tx=state.tickets.filter(t=>t.buyerId===b.id),spent=tx.reduce((s,t)=>s+Number(t.salePrice||0),0),profit=tx.reduce((s,t)=>s+(Number(t.salePrice||0)-Number(t.costPrice||0)),0);return `<article class="buyer"><div class="avatar">${esc((b.name||'?').slice(0,2).toUpperCase())}</div><h4>${esc(b.name)}</h4><p>${esc(b.email||'No email')}</p><p>${esc(b.phone||'No phone')}</p><div class="statsrow"><div class="statmini"><b>${tx.length}</b><span>Tickets</span></div><div class="statmini"><b>${money(spent)}</b><span>Spent</span></div><div class="statmini"><b class="${profit>=0?'good':'bad'}">${money(profit)}</b><span>Profit</span></div></div><div class="actions" style="margin-top:12px"><button class="mini" onclick="openBuyerModal('${b.id}')">Edit</button><button class="mini" onclick="filterBuyer('${b.id}')">View tickets</button><button class="mini" onclick="removeBuyer('${b.id}')">×</button></div>${b.notes?`<div class="meta" style="margin-top:10px">${esc(b.notes)}</div>`:''}</article>`}
function analyticsView(){const t=totals();const byClub=state.clubs.map(c=>{const sold=state.tickets.filter(x=>x.clubId===c.id&&['sold','sent','used'].includes(x.status));const rev=sold.reduce((s,x)=>s+Number(x.salePrice||0),0),cost=sold.reduce((s,x)=>s+Number(x.costPrice||0),0);return{c,rev,profit:rev-cost,count:sold.length}});const max=Math.max(1,...byClub.map(x=>Math.max(0,x.profit)));return `<section class="hero"><div class="eyebrow">Analytics</div><h2>See where your money is actually being made.</h2><p>Realised performance is calculated from tickets marked sold, sent or used.</p></section><div class="kpis"><div class="kpi"><div class="label">Revenue</div><div class="value blue">${money(t.revenue)}</div></div><div class="kpi"><div class="label">Profit</div><div class="value ${t.profit>=0?'good':'bad'}">${money(t.profit)}</div></div><div class="kpi"><div class="label">Unsold value</div><div class="value gold">${money(t.unsold)}</div></div><div class="kpi"><div class="label">Sell through</div><div class="value">${t.count?Math.round(t.sold/t.count*100):0}%</div></div><div class="kpi"><div class="label">Avg profit / sold</div><div class="value">${money(t.sold?t.profit/t.sold:0)}</div></div></div><section class="panel"><div class="panelhead"><div><h3>Profit by club</h3><div class="subtle">Realised ticket margin</div></div></div><div class="barlist">${byClub.map(x=>`<div class="barrow"><span>${esc(x.c.name)}</span><div class="bartrack"><div class="barfill" style="width:${Math.max(3,x.profit/max*100)}%;background:${x.c.color}"></div></div><b class="${x.profit>=0?'good':'bad'}">${money(x.profit)}</b></div>`).join('')}</div></section>`}
function clubView(){const c=club(clubFilter);const tickets=state.tickets.filter(t=>t.clubId===c.id),members=state.memberships.filter(m=>m.clubId===c.id);return `<section class="hero"><div class="clubhero"><div class="clubidentity"><div class="crest" style="background:linear-gradient(145deg,${c.color},#50101a)">${esc(c.icon)}</div><div><div class="eyebrow">Club workspace</div><h2>${esc(c.name)}</h2><p>${tickets.length} tickets · ${members.length} memberships</p></div></div><a class="btn" href="${esc(c.portal)}" target="_blank" rel="noopener">Club portal ↗</a></div></section><div class="tabs"><button class="tab ${clubTab==='tickets'?'active':''}" onclick="clubTab='tickets';render()">Tickets</button><button class="tab ${clubTab==='memberships'?'active':''}" onclick="clubTab='memberships';render()">Memberships</button><button class="tab ${clubTab==='buyers'?'active':''}" onclick="clubTab='buyers';render()">Buyers</button></div>${clubTab==='memberships'?(members.length?`<div class="cards">${members.map(membershipCard).join('')}</div>`:empty('No memberships for this club.')):clubTab==='buyers'?clubBuyers(c.id):(tickets.length?`<section class="panel">${ticketTable(tickets)}</section>`:empty('No tickets for this club.'))}`}
function clubBuyers(id){const ids=new Set(state.tickets.filter(t=>t.clubId===id&&t.buyerId).map(t=>t.buyerId)),bs=state.buyers.filter(b=>ids.has(b.id));return bs.length?`<div class="buyergrid">${bs.map(buyerCard).join('')}</div>`:empty('No buyers linked to this club yet.')}
function empty(msg){return `<div class="empty">${esc(msg)}</div>`}
function setView(v){view=v;if(v!=='club')clubFilter='all';render();window.scrollTo({top:0,behavior:'smooth'})}
function openClub(id){view='club';clubFilter=id;clubTab='tickets';render();window.scrollTo({top:0,behavior:'smooth'})}
function filterBuyer(id){view='inventory';searchText=buyer(id)?.name||'';render()}
function openQuickAdd(){modal(`<div class="modalhead"><h3>Add to Matchday Vault</h3><button class="close" onclick="closeModal()">×</button></div><div class="cards"><button class="card" style="text-align:left;color:var(--text);cursor:pointer" onclick="closeModal();openTicketModal()"><div class="club-badge">🎟 Inventory</div><h4>Ticket</h4><div class="small">Fixture, buyer, pricing, ticket link and status</div></button><button class="card" style="text-align:left;color:var(--text);cursor:pointer" onclick="closeModal();openMembershipModal()"><div class="club-badge">◇ Vault</div><h4>Membership</h4><div class="small">Login, member number, renewal and portal</div></button><button class="card" style="text-align:left;color:var(--text);cursor:pointer" onclick="closeModal();openBuyerModal()"><div class="club-badge">◎ CRM</div><h4>Buyer</h4><div class="small">Contact details and purchase history</div></button></div>`)}
function modal(html){$('#modal-root').innerHTML=`<div class="overlay" id="overlay"><div class="modal">${html}</div></div>`;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()})}
function closeModal(){pendingFiles=[];$('#modal-root').innerHTML=''}
function clubOptions(selected){return state.clubs.map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
function buyerOptions(selected){return `<option value="">No buyer</option>${state.buyers.map(b=>`<option value="${b.id}" ${selected===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}`}
function openTicketModal(id=''){const t=state.tickets.find(x=>x.id===id)||{clubId:clubFilter!=='all'?clubFilter:'arsenal',status:'available',paymentStatus:'unpaid',quantity:1};pendingFiles=[...(t.files||[])];modal(`<div class="modalhead"><h3>${id?'Edit':'Add'} ticket</h3><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>Club</label><select id="t-club">${clubOptions(t.clubId)}</select></div><div class="field"><label>Competition</label><input id="t-comp" value="${esc(t.competition||'')}" placeholder="Premier League"></div><div class="field full"><label>Fixture / event</label><input id="t-event" value="${esc(t.event||'')}" placeholder="Arsenal vs Chelsea"></div><div class="field"><label>Date</label><input id="t-date" type="date" value="${esc(t.date||'')}"></div><div class="field"><label>Kick off</label><input id="t-time" type="time" value="${esc(t.kickoff||'')}"></div><div class="field"><label>Block</label><input id="t-block" value="${esc(t.block||'')}" placeholder="Block 123"></div><div class="field"><label>Row / seat</label><input id="t-seat" value="${esc(t.seat||'')}" placeholder="Row 8, Seat 42"></div><div class="field"><label>Quantity</label><input id="t-qty" type="number" min="1" value="${esc(t.quantity||1)}"></div><div class="field"><label>Ticket status</label><select id="t-status">${['available','reserved','awaiting','sent','sold','used'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${labelStatus(s)}</option>`).join('')}</select></div><div class="field"><label>Cost price (£)</label><input id="t-cost" type="number" step="0.01" value="${esc(t.costPrice||'')}"></div><div class="field"><label>Sale price (£)</label><input id="t-sale" type="number" step="0.01" value="${esc(t.salePrice||'')}"></div><div class="field"><label>Buyer</label><select id="t-buyer">${buyerOptions(t.buyerId)}</select></div><div class="field"><label>Payment</label><select id="t-payment"><option value="unpaid" ${t.paymentSt function bytesToB64(bytes){let out='';for(let i=0;i<bytes.length;i+=0x8000)out+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(out)}
function b64ToBytes(s){const bin=atob(s),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function deriveKey(password,salt){const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function makeEncryptedBackup(password){
  if(!window.crypto?.subtle)throw new Error('Encryption is not supported in this browser.');
  const enc=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(password,salt);
  const payload=enc.encode(JSON.stringify({app:'Matchday Vault',version:'6.0',createdAt:new Date().toISOString(),state}));
  const cipher=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,payload));
  return JSON.stringify({format:'matchday-vault-encrypted-v1',kdf:'PBKDF2-SHA256',iterations:250000,salt:bytesToB64(salt),iv:bytesToB64(iv),ciphertext:bytesToB64(cipher)},null,2);
}
async function decryptBackup(text,password){
  const box=JSON.parse(text);if(box.format!=='matchday-vault-encrypted-v1')throw new Error('Not an encrypted Matchday backup');
  const key=await deriveKey(password,b64ToBytes(box.salt));
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(box.iv)},key,b64ToBytes(box.ciphertext));
  const payload=JSON.parse(new TextDecoder().decode(plain));if(!payload.state||!Array.isArray(payload.state.tickets))throw new Error('Invalid backup');return payload.state;
}
function downloadText(text,name,type='application/json'){const blob=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openBackupCenter(){

  modal(`<div class="modalhead"><h3>🔐 Backup & recovery</h3><button class="close" onclick="closeModal()">×</button></div>

  </div>
  <div class="cards" style="grid-template-columns:1fr 1fr;margin-top:8px">
    <div class="card"><div class="club-badge">Recommended</div><h4>Encrypted backup</h4><div class="small">Password-protected AES-256 backup.</div><button class="btn primary" style="margin-top:12px;width:100%" onclick="exportEncrypted()">Download secure backup</button></div>
    <div class="card"><div class="club-badge">Restore</div><h4>Encrypted restore</h4><div class="small">Restore a .matchday backup on this or another device.</div><button class="btn" style="margin-top:12px;width:100%" onclick="importEncrypted()">Choose backup file</button></div>
  </div>
  <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"><button class="btn" onclick="exportData()">Export plain JSON (advanced)</button> <button class="btn" onclick="recoverPrevious()">Recover previous local copy</button></div>
  <div class="modalactions"><button class="btn" onclick="closeModal()">Close</button></div>`)
}
async function exportEncrypted(){
  const p=$('#backup-pass')?.value||'';if(p.length<6){alert('Use a backup password of at least 6 characters.');$('#backup-pass')?.focus();return}
  try{const text=await makeEncryptedBackup(p);downloadText(text,'matchday-vault-secure-'+new Date().toISOString().slice(0,10)+'.matchday','application/octet-stream');toast('Encrypted backup downloaded')}catch(e){alert('Could not create encrypted backup: '+e.message)}
}
function importEncrypted(){
  const p=$('#backup-pass')?.value||'';if(!p){alert('Enter the backup password first.');$('#backup-pass')?.focus();return}
  const i=document.createElement('input');i.type='file';i.accept='.matchday,.json';i.onchange=async()=>{try{const restored=await decryptBackup(await i.files[0].text(),p);if(confirm('Restore this encrypted backup? This will replace the current Matchday data on this device.')){hydrate(restored);save();closeModal();render();toast('Backup restored')}}catch(e){alert('Could not unlock that backup. Check the file and password.')}};i.click()
}
function recoverPrevious(){const raw=localStorage.getItem(RECOVERY_KEY);if(!raw){alert('There is no previous local recovery copy yet.');return}if(confirm('Replace the current data with the previous local recovery copy?')){try{hydrate(JSON.parse(raw));save();closeModal();render();toast('Previous copy recovered')}catch{alert('The recovery copy could not be read.')}}}
function exportData(){downloadText(JSON.stringify(state,null,2),'matchday-vault-plain-'+new Date().toISOString().slice(0,10)+'.json')}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const x=JSON.parse(await i.files[0].text());if(!x||!Array.isArray(x.tickets))throw new Error('Invalid');if(confirm('Replace the current Matchday Vault data with this backup?')){hydrate(x);save();render()}}catch{alert('That does not look like a valid Matchday Vault backup.')}};i.click()}

function inventoryView(){let items=[...state.tickets];if(clubFilter!=='all')items=items.filter(t=>t.clubId===clubFilter);if(ticketStatus!=='all')items=items.filter(t=>t.status===ticketStatus);if(searchText){const q=searchText.toLowerCase();items=items.filter(t=>JSON.stringify(t).toLowerCase().includes(q)||(buyer(t.buyerId)?.name||'').toLowerCase().includes(q)||club(t.clubId).name.toLowerCase().includes(q))}items.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return `<section class="hero"><div class="eyebrow">TICKET INVENTORY</div><h2>${state.tickets.length} tickets under control.</h2><p>See stock, who bought it, payment state, ticket link, seat, sale price and margin without digging around.</p></section><section class="panel"><div class="toolbar"><div class="search"><span>⌕</span><input placeholder="Search fixture, buyer, email, seat…" value="${esc(searchText)}" oninput="searchText=this.value;render()"></div><select class="filter" onchange="clubFilter=this.value;render()"><option value="all">All clubs</option>${state.clubs.map(c=>`<option value="${c.id}" ${clubFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select class="filter" onchange="ticketStatus=this.value;render()"><option value="all">All statuses</option>${['available','reserved','awaiting','sent','sold','used'].map(s=>`<option value="${s}" ${ticketStatus===s?'selected':''}>${labelStatus(s)}</option>`).join('')}</select><button class="btn primary" onclick="openTicketModal()">+ Ticket</button></div>${items.length?ticketTable(items)+ticketMobileCards(items):empty('No tickets match these filters.')}</section>`}
function clubView(){const c=club(clubFilter);const tickets=state.tickets.filter(t=>t.clubId===c.id),members=state.memberships.filter(m=>m.clubId===c.id);return `<section class="hero"><div class="clubhero"><div class="clubidentity"><div class="crest" style="background:linear-gradient(145deg,${c.color},#541018)">${esc(c.short)}</div><div><div class="eyebrow">CLUB WORKSPACE</div><h2>${esc(c.name)}</h2><p>${members.length} memberships · ${tickets.length} tickets · ${tickets.filter(t=>!['sold','sent','used'].includes(t.status)).length} open</p></div></div><a class="btn" href="${esc(c.portal)}" target="_blank" rel="noopener">Club portal ↗</a></div></section><div class="tabs"><button class="tab ${clubTab==='memberships'?'active':''}" onclick="clubTab='memberships';render()">Memberships (${members.length})</button><button class="tab ${clubTab==='tickets'?'active':''}" onclick="clubTab='tickets';render()">Tickets (${tickets.length})</button><button class="tab ${clubTab==='buyers'?'active':''}" onclick="clubTab='buyers';render()">Buyers</button></div>${clubTab==='memberships'?(members.length?`<div class="member-grid">${members.map(membershipCard).join('')}</div>`:empty('No memberships for this club yet.')):clubTab==='buyers'?clubBuyers(c.id):(tickets.length?`<section class="panel">${ticketTable(tickets)}${ticketMobileCards(tickets)}</section>`:empty('No tickets for this club yet.'))}`}
function openClub(id){view='club';clubFilter=id;clubTab='memberships';render();window.scrollTo({top:0,behavior:'smooth'})}


// ===== MATCHDAY VAULT V5 — schedules + richer club workspace =====
if(!Array.isArray(state.fixtures)) state.fixtures=[];

function ensureV5State(){
  if(!Array.isArray(state.fixtures)) state.fixtures=[];
  if(!state.settings) state.settings={currency:'GBP'};
}
const _v5OldHydrate = hydrate;
hydrate = function(x){ _v5OldHydrate(x); ensureV5State(); };

  if(id==='manutd') return `<svg viewBox="0 0 64 76" aria-label="Manchester United"><path d="M32 2 59 12 55 49 32 73 9 49 5 12Z" fill="#d71920" stroke="#f9d849" stroke-width="2"/><path d="M21 22h22l-3 12H24Z" fill="#f9d849"/><path d="M32 22v30M24 35l8 7 8-7M26 52h12" stroke="#f9d849" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="18" r="4" fill="#f9d849"/></svg>`;
  return `<svg viewBox="0 0 64 76" aria-label="Liverpool"><path d="M32 2 58 11v30c0 15-10 26-26 33C16 67 6 56 6 41V12Z" fill="#c8102e" stroke="#00b2a9" stroke-width="2"/><path d="M34 18c-10 3-14 10-10 17 3 6 11 6 14 12 2 4-1 8-5 11 9-2 16-9 15-17-1-7-7-10-11-13 5-1 8-5 8-10-3 3-7 4-11 0Z" fill="#f4efe7"/><path d="M19 56h26" stroke="#00b2a9" stroke-width="3" stroke-linecap="round"/></svg>`;
}
function crest(id,small=false){return `<div class="v5-crest ${small?'small':''}">${clubCrestSvg(id)}</div>`}

function fixtureItems(){
  ensureV5State();
  return [...state.fixtures].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999') || (a.kickoff||'99').localeCompare(b.kickoff||'99'));
}
function upcomingFixtures(){
  const today=new Date(); today.setHours(0,0,0,0);
  return fixtureItems().filter(f=>!f.date || new Date(f.date+'T00:00:00')>=today);
}
function daysTo(date){
  if(!date)return null; const now=new Date();now.setHours(0,0,0,0);const d=new Date(date+'T00:00:00');return Math.round((d-now)/86400000);
}
function countdownText(date){
  const d=daysTo(date); if(d===null)return'TBC'; if(d<0)return'Played'; if(d===0)return'Today'; if(d===1)return'Tomorrow'; return `In ${d} days`;
}
function fixtureStatusLabel(s){return ({planned:'Planned',ballot:'Ballot',onsale:'On sale',secured:'Tickets secured',done:'Done'})[s]||'Planned'}
function matchingTickets(f){return state.tickets.filter(t=>t.clubId===f.clubId && ((f.date&&t.date===f.date) || (f.event&&t.event===f.event)))}

function nextUpCard(){
  const f=upcomingFixtures()[0];
  if(!f) return `<aside class="nextup-card"><div><div class="nextup-label">Next up</div><div class="nextup-clubs">${crest('arsenal')}<div class="nextup-main"><h3>Add your fixture schedule</h3><div class="nextup-meta">Save Arsenal, United and Liverpool matches separately from the tickets you own.</div></div></div></div><div class="nextup-foot"><span class="countdown">Ready when you are</span><button class="mini" onclick="openFixtureModal()">+ Fixture</button></div></aside>`;
  const c=club(f.clubId), n=matchingTickets(f).length, u=safeUrl(f.ticketLink||c.portal);
  return `<aside class="nextup-card"><div><div class="nextup-label">Next up · ${esc(countdownText(f.date))}</div><div class="nextup-clubs">${crest(c.id)}<div class="nextup-main"><h3>${esc(f.event||'Fixture')}</h3><div class="nextup-meta">${esc(c.name)} · ${fmtDate(f.date)} · ${esc(f.kickoff||'TBC')}<br>${esc(f.venue||'Venue TBC')} · ${n} ticket${n===1?'':'s'} tracked</div></div></div></div><div class="nextup-foot"><span class="countdown">${esc(fixtureStatusLabel(f.status))}</span><div class="fixture-actions">${u?`<a class="ticket-link-prominent" href="${esc(u)}" target="_blank" rel="noopener">Match / ticket link ↗</a>`:''}<button class="mini" onclick="openFixtureModal('${f.id}')">Open</button></div></div></aside>`;
}

function v5ClubCards(){
  return `<div class="v5-club-grid">${state.clubs.map(c=>{const x=clubStats(c),nf=upcomingFixtures().find(f=>f.clubId===c.id);return `<article class="v5-club" style="--club-glow:${c.color}3d" onclick="openClub('${c.id}')"><div class="v5-club-head"><div class="v5-club-title">${crest(c.id,true)}<div><h3>${esc(c.name)}</h3><div class="meta">${nf?`Next: ${esc(nf.event||'Fixture')} · ${fmtShort(nf.date)}`:'No fixture scheduled'}</div></div></div><span class="v5-open">OPEN →</span></div><div class="v5-club-stats"><div class="v5-club-stat"><b>${x.members}</b><span>Members</span></div><div class="v5-club-stat"><b>${x.tickets}</b><span>Tickets</span></div><div class="v5-club-stat"><b>${state.fixtures.filter(f=>f.clubId===c.id).length}</b><span>Fixtures</span></div></div></article>`}).join('')}</div>`;
}

function fixtureRows(items,limit=99){
  const rows=items.slice(0,limit);
  if(!rows.length)return empty('No fixtures scheduled yet. Add the matches you want to track.');
  return `<div class="fixture-stack">${rows.map(f=>{const c=club(f.clubId),u=safeUrl(f.ticketLink||''),n=matchingTickets(f).length,d=f.date?new Date(f.date+'T00:00:00'):null;return `<div class="fixture-row" onclick="openFixtureModal('${f.id}')"><div class="fixture-date"><b>${d?d.getDate():'—'}</b><span>${d?d.toLocaleDateString('en-GB',{month:'short'}):'TBC'}</span></div>${crest(c.id,true)}<div class="fixture-info"><b>${esc(f.event||'Fixture')}</b><span>${esc(c.name)} · ${esc(f.kickoff||'TBC')} · ${esc(f.competition||'Competition TBC')} · ${n} ticket${n===1?'':'s'}</span></div><div class="fixture-actions">${u?`<a class="ticket-link-prominent" href="${esc(u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Link ↗</a>`:''}<span class="game-status ${esc(f.status||'planned')}">${esc(fixtureStatusLabel(f.status))}</span></div></div>`}).join('')}</div>`;
}

function renderMain(t){
  ensureV5State();
  if(view==='schedule')return scheduleView();
  if(view==='inventory')return inventoryView();
  if(view==='buyers')return buyersView();
  if(view==='memberships')return membershipsView();
  if(view==='analytics')return analyticsView();
  if(view==='club')return clubView();
  return dashboardView(t);
}
function mobileNav(){
  return [['dashboard','⌂','Home'],['schedule','▦','Games'],['inventory','🎟','Tickets'],['memberships','◇','Members'],['buyers','◎','Buyers']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="setView('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');
}

  ensureV5State();
  const t=totals();
  $('#app').innerHTML=`
  <div class="topbar"><div class="brand"><div class="brandmark">MV</div><div><h1>Matchday Vault</h1><p>Ticket & membership command centre</p></div></div><div class="top-actions"><button class="btn secondary-hide" onclick="setView('schedule')">Schedule</button><button class="btn primary" onclick="openQuickAddV5()">+ Add</button></div></div>
  <div class="layout"><aside class="sidebar"><div class="sidebox"><div class="navlabel">Command centre</div>${navItem('dashboard','⌂','Dashboard')}${navItem('schedule','▦','Fixtures',state.fixtures.length)}${navItem('inventory','🎟','Tickets',state.tickets.length)}${navItem('memberships','◇','Memberships',state.memberships.length)}${navItem('buyers','◎','Buyers',state.buyers.length)}${navItem('analytics','↗','Analytics')}<div class="navlabel">Clubs</div>${state.clubs.map(c=>{const x=clubStats(c);return `<button class="navbtn ${view==='club'&&clubFilter===c.id?'active':''}" onclick="openClub('${c.id}')">${crest(c.id,true)}<span>${esc(c.name)}</span><span class="pillcount">${x.members}/${x.tickets}</span></button>`}).join('')}<div class="sidefooter"><button class="navbtn" onclick="openBackupCenter()"><span class="navico">🔐</span>Backup & recovery</button></div></div></aside><main class="main">${renderMain(t)}</main></div>
  <button class="fab" onclick="openQuickAddV5()">+</button><div class="mobilebar">${mobileNav()}</div>`;

  return `
  <div class="v5-dashboard-hero"><section class="v5-welcome"><div class="eyebrow">MATCHDAY VAULT</div><h2>Your memberships, games and tickets — without the mess.</h2><p>Run Arsenal, Manchester United and Liverpool from one place. Know your next game, which account it sits on, who bought the ticket, whether they paid, and where the ticket link lives.</p><div class="v5-hero-actions"><button class="btn primary" onclick="openMembershipModal()">+ Membership</button><button class="btn" onclick="openFixtureModal()">+ Fixture</button><button class="btn" onclick="openTicketModal()">+ Ticket</button></div></section>${nextUpCard()}</div>

  ensureV6State();
  seedHomeFixtures();
  let items=fixtureItems();
  if(clubFilter!=='all') items=items.filter(f=>f.clubId===clubFilter);
  return `<div class="v5-page-head"><div><div class="eyebrow">FIXTURES</div><h2>2026/27 home schedule</h2><p>${state.fixtures.length} home fixtures loaded. Confirmed kickoff times are shown in UK local time; unconfirmed times stay TBD.</p></div><button class="btn primary" onclick="openFixtureModal()">+ Fixture</button></div>
  <div class="membership-filterbar"><button class="club-filter-chip ${clubFilter==='all'?'active':''}" onclick="clubFilter='all';render()">All · ${state.fixtures.length}</button>${state.clubs.map(c=>`<button class="club-filter-chip ${clubFilter===c.id?'active':''}" onclick="clubFilter='${c.id}';render()">${esc(c.name)} · ${state.fixtures.filter(f=>f.clubId===c.id).length}</button>`).join('')}</div>

}function scheduleCard(f){

function saveFixture(id=''){
  const event=$('#f-event').value.trim();if(!event){$('#f-event').focus();return}
  const obj={id:id||uid(),clubId:$('#f-club').value,competition:$('#f-comp').value.trim(),event,date:$('#f-date').value,kickoff:$('#f-time').value,venue:$('#f-venue').value.trim(),status:$('#f-status').value,reference:$('#f-ref').value.trim(),ticketLink:$('#f-link').value.trim(),notes:$('#f-notes').value.trim(),updatedAt:new Date().toISOString(),createdAt:(state.fixtures.find(x=>x.id===id)?.createdAt)||new Date().toISOString()};
  const i=state.fixtures.findIndex(x=>x.id===id);if(i>=0)state.fixtures[i]=obj;else state.fixtures.push(obj);save();closeModal();render();toast('Fixture saved');
}
function removeFixture(id){if(!confirm('Remove this fixture from the schedule? Tickets will stay in inventory.'))return;state.fixtures=state.fixtures.filter(f=>f.id!==id);save();render()}
function addTicketFromFixture(id){
  const f=state.fixtures.find(x=>x.id===id);if(!f)return;openTicketModal();setTimeout(()=>{if($('#t-club'))$('#t-club').value=f.clubId;if($('#t-comp'))$('#t-comp').value=f.competition||'';if($('#t-event'))$('#t-event').value=f.event||'';if($('#t-date'))$('#t-date').value=f.date||'';if($('#t-time'))$('#t-time').value=f.kickoff||'';if($('#t-link'))$('#t-link').value=f.ticketLink||'';},0);
}


// ===== MATCHDAY VAULT V6 =====
function ensureV6State(){
  ensureV5State();
  if(!Array.isArray(state.groups)) state.groups=[];
  if(!Array.isArray(state.ballots)) state.ballots=[];
  if(!Array.isArray(state.paymentMethods)) state.paymentMethods=[];
  state.memberships.forEach(m=>{
    if(!('memberName' in m)) m.memberName='';
    if(!Array.isArray(m.groupIds)) m.groupIds=[];
    if(!Array.isArray(m.paymentMethodIds)) m.paymentMethodIds=[];
  });
  state.tickets.forEach(t=>{ if(!('paymentMethodId' in t)) t.paymentMethodId=''; });
}
const _hydrateV6Previous = hydrate;
hydrate = function(x){ _hydrateV6Previous(x); ensureV6State(); };

function membershipLabel(m){return m.memberName||m.type||m.email||m.memberNumber||'Member'}
function paymentById(id){return state.paymentMethods.find(p=>p.id===id)}
function groupById(id){return state.groups.find(g=>g.id===id)}
function membershipsForClub(id){return state.memberships.filter(m=>m.clubId===id)}
function paymentOptions(selected='',clubId=''){return `<option value="">No card selected</option>${state.paymentMethods.filter(p=>!clubId||!p.clubId||p.clubId===clubId).map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.nickname||'Card')} •••• ${esc(p.last4||'----')}</option>`).join('')}`}
function groupOptions(selected='',clubId=''){return `<option value="">No F&F group</option>${state.groups.filter(g=>!clubId||g.clubId===clubId).map(g=>`<option value="${g.id}" ${selected===g.id?'selected':''}>${esc(g.name)} (${g.memberIds?.length||0})</option>`).join('')}`}
function fixtureOptions(selected='',clubId=''){return `<option value="">No fixture linked</option>${fixtureItems().filter(f=>!clubId||f.clubId===clubId).map(f=>`<option value="${f.id}" ${selected===f.id?'selected':''}>${esc(f.event||'Fixture')} · ${fmtShort(f.date)}</option>`).join('')}`}
function selectedMembershipIds(){return [...document.querySelectorAll('.v6-member-check:checked')].map(x=>x.value)}
function memberChecks(clubId,selected=[]){
  const ms=membershipsForClub(clubId);
  if(!ms.length)return `<div class="v6-note">Add memberships for this club first.</div>`;
  return `<div class="select-list">${ms.map(m=>`<div class="select-item"><input class="v6-member-check" type="checkbox" id="mc-${m.id}" value="${m.id}" ${selected.includes(m.id)?'checked':''}><label for="mc-${m.id}"><b>${esc(membershipLabel(m))}</b> · ${esc(m.memberNumber||'No member #')} · ${esc(m.email||'No email')}</label></div>`).join('')}</div>`;
}
function ballotTypeLabel(v){return ({standard:'Standard',local:'Local Ballot',youngadult:'Young Adult Ballot'})[v]||'Standard'}
function ballotStatusLabel(v){return ({planned:'Planned',entered:'Entered',successful:'Successful',unsuccessful:'Unsuccessful'})[v]||'Planned'}
function deadlineClass(date){const d=daysTo(date);if(d===null||d<0)return'';if(d<=2)return'urgent';if(d>7)return'good';return''}
function upcomingBallots(){return [...state.ballots].filter(b=>b.closeDate&&daysTo(b.closeDate)>=0).sort((a,b)=>a.closeDate.localeCompare(b.closeDate))}
function cardAssignments(id){return state.memberships.filter(m=>(m.paymentMethodIds||[]).includes(id))}
function groupsContainingMembership(id){return state.groups.filter(g=>(g.memberIds||[]).includes(id))}

function v6Alerts(){
  const upcoming=upcomingBallots(), urgent=upcoming.filter(b=>daysTo(b.closeDate)<=3).length;
  const groups=state.groups.length, cards=state.paymentMethods.length;
  return `<div class="v6-alert-grid"><div class="v6-alert"><span>Ballots closing</span><b class="${urgent?'bad':''}">${urgent}</b><p>${upcoming.length} upcoming ballot${upcoming.length===1?'':'s'}</p></div><div class="v6-alert"><span>Friends & Family</span><b>${groups}</b><p>Linked membership groups</p></div><div class="v6-alert"><span>Payment cards</span><b>${cards}</b><p>Saved by nickname + last 4 only</p></div></div>`;
}
function ballotPreview(){
  const items=upcomingBallots().slice(0,4);
  if(!items.length)return empty('No upcoming ballot deadlines.');
  return `<div class="fixture-stack">${items.map(b=>{const c=club(b.clubId),f=state.fixtures.find(x=>x.id===b.fixtureId),d=daysTo(b.closeDate);return `<div class="fixture-row" onclick="openBallotModal('${b.id}')"><div class="fixture-date"><b>${d===0?'!':d}</b><span>${d===0?'today':'days'}</span></div>${crest(c.id,true)}<div class="fixture-info"><b>${esc(f?.event||b.fixtureName||'Ballot')}</b><span>${esc(ballotTypeLabel(b.type))} · ${esc(c.name)} · ${b.memberIds?.length||0} member${b.memberIds?.length===1?'':'s'}</span></div><span class="ballot-status ${esc(b.status||'planned')}">${esc(ballotStatusLabel(b.status))}</span></div>`}).join('')}</div>`;
}

function renderMain(t){
  ensureV6State();
  if(view==='ballots')return ballotsView();
  if(view==='groups')return groupsView();
  if(view==='payments')return paymentsView();
  if(view==='schedule')return scheduleView();
  if(view==='inventory')return inventoryView();
  if(view==='buyers')return buyersView();
  if(view==='memberships')return membershipsView();
  if(view==='analytics')return analyticsView();
  if(view==='club')return clubView();
  return dashboardView(t);
}

  ensureV6State();
  seedHomeFixtures();
  const t=totals();
  $('#app').innerHTML=`
  <div class="topbar"><div class="brand"><div class="brandmark">MV</div><div><h1>Matchday Vault</h1><p>Ticket & membership command centre</p></div></div><div class="top-actions"><button class="btn secondary-hide" onclick="setView('ballots')">Ballots</button><button class="btn primary" onclick="openQuickAddV6()">+ Add</button></div></div>
  <div class="layout"><aside class="sidebar"><div class="sidebox"><div class="navlabel">Command centre</div>${navItem('dashboard','⌂','Dashboard')}${navItem('schedule','▦','Fixtures',state.fixtures.length)}${navItem('ballots','◈','Ballots',state.ballots.length)}${navItem('inventory','🎟','Tickets',state.tickets.length)}${navItem('memberships','◇','Memberships',state.memberships.length)}${navItem('groups','◎','F&F Groups',state.groups.length)}${navItem('payments','▣','Payment Cards',state.paymentMethods.length)}${navItem('buyers','◉','Buyers',state.buyers.length)}${navItem('analytics','↗','Analytics')}<div class="navlabel">Clubs</div>${state.clubs.map(c=>{const x=clubStats(c);return `<button class="navbtn ${view==='club'&&clubFilter===c.id?'active':''}" onclick="openClub('${c.id}')">${crest(c.id,true)}<span>${esc(c.name)}</span><span class="pillcount">${x.members}/${x.tickets}</span></button>`}).join('')}<div class="sidefooter"><button class="navbtn" onclick="openBackupCenter()"><span class="navico">🔐</span>Backup & recovery</button></div></div></aside><main class="main">${renderMain(t)}</main></div>
  <button class="fab" onclick="openQuickAddV6()">+</button><div class="mobilebar">${mobileNav()}</div>`;

function mobileNav(){
  return [['dashboard','⌂','Home'],['schedule','▦','Games'],['ballots','◈','Ballots'],['memberships','◇','Members'],['inventory','🎟','Tickets']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="setView('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');

function groupsView(){ensureV6State();return `<div class="v5-page-head"><div><div class="eyebrow">FRIENDS & FAMILY</div><h2>Linked membership groups</h2><p>Group memberships the same way you have them linked with each club.</p></div><button class="btn primary" onclick="openGroupModal()">+ New group</button></div>${groupsGrid(state.groups)}`}

function ballotsView(){ensureV6State();return `<div class="v5-page-head"><div><div class="eyebrow">BALLOT CENTRE</div><h2>Never miss a ballot window</h2><p>Track Standard, Local and Young Adult ballots, memberships entered, card used and result.</p></div><button class="btn primary" onclick="openBallotModal()">+ New ballot</button></div>${ballotsGrid([...state.ballots].sort((a,b)=>(a.closeDate||'9999').localeCompare(b.closeDate||'9999')))}`}
function ballotsGrid(items){return items.length?`<div class="ballot-grid">${items.map(b=>{const c=club(b.clubId),f=state.fixtures.find(x=>x.id===b.fixtureId),p=paymentById(b.paymentMethodId),ms=(b.memberIds||[]).map(id=>state.memberships.find(m=>m.id===id)).filter(Boolean),d=daysTo(b.closeDate);return `<article class="ballot-card" style="--card-accent:${c.color}"><div class="card-eyebrow">${esc(c.name)} · ${esc(ballotTypeLabel(b.type))}</div><div class="card-title">${esc(f?.event||b.fixtureName||'Ballot')}</div><div class="card-sub">Closes ${fmtDate(b.closeDate)}${b.resultDate?' · Result '+fmtDate(b.resultDate):''}</div><div class="member-pills">${ms.map(m=>`<span class="member-pill">${esc(membershipLabel(m))}</span>`).join('')}</div><div style="margin-top:10px"><span class="ballot-status ${esc(b.status||'planned')}">${esc(ballotStatusLabel(b.status))}</span>${p?` <span class="member-pill">Card: ${esc(p.nickname)} •••• ${esc(p.last4)}</span>`:''}</div><div class="card-footer"><span class="deadline ${deadlineClass(b.closeDate)}">${d===0?'Closes today':d>0?`${d} days left`:b.closeDate?'Closed':'No deadline'}</span><div class="actions"><button class="mini" onclick="openBallotModal('${b.id}')">Edit</button><button class="mini" onclick="removeBallot('${b.id}')">×</button></div></div></article>`}).join('')}</div>`:empty('No ballots tracked yet.')}

function paymentsView(){ensureV6State();return `<div class="v5-page-head"><div><div class="eyebrow">PAYMENT METHODS</div><h2>Know which card belongs where</h2><p>Store only a nickname, cardholder, last four digits and expiry — never a full card number or CVV.</p></div><button class="btn primary" onclick="openPaymentModal()">+ Payment card</button></div><div class="v6-note" style="margin-bottom:12px">Use payment methods in accordance with each club's rules. Matchday Vault is for organisation, not bypassing account restrictions.</div>${paymentsGrid(state.paymentMethods)}`}
function paymentsGrid(items,clubId=''){const shown=clubId?items.filter(p=>!p.clubId||p.clubId===clubId):items;return shown.length?`<div class="payment-grid">${shown.map(p=>{const c=p.clubId?club(p.clubId):null,assigned=cardAssignments(p.id);return `<article class="payment-card" style="--card-accent:${c?.color||'#ffd36a'}"><div class="card-visual"><div class="card-chip"></div><div><div class="card-number">•••• •••• •••• ${esc(p.last4||'----')}</div><div class="card-holder">${esc(p.cardholder||p.nickname||'CARD')}</div></div></div><div class="card-eyebrow">${c?esc(c.name):'All clubs'} · ${esc(p.nickname||'Payment card')}</div><div class="card-sub">Expiry ${esc(p.expiry||'—')} · ${assigned.length} membership${assigned.length===1?'':'s'} assigned</div><div class="member-pills">${assigned.slice(0,6).map(m=>`<span class="member-pill">${esc(membershipLabel(m))}</span>`).join('')}</div><div class="card-footer"><span class="meta">${esc(p.notes||'')}</span><div class="actions"><button class="mini" onclick="openPaymentModal('${p.id}')">Edit</button><button class="mini" onclick="removePayment('${p.id}')">×</button></div></div></article>`}).join('')}</div>`:empty('No payment methods saved yet.')}

function openQuickAddV6(){modal(`<div class="modalhead"><h3>Add to Matchday Vault</h3><button class="close" onclick="closeModal()">×</button></div><div class="quick-actions" style="grid-template-columns:1fr 1fr"><button class="quick-card" onclick="closeModal();openMembershipModal()"><b>◇ Membership</b><span>Member, email, group & card</span></button><button class="quick-card" onclick="closeModal();openGroupModal()"><b>◎ F&F Group</b><span>Link memberships together</span></button><button class="quick-card" onclick="closeModal();openBallotModal()"><b>◈ Ballot</b><span>Local, Young Adult or standard</span></button><button class="quick-card" onclick="closeModal();openPaymentModal()"><b>▣ Payment card</b><span>Nickname + last four only</span></button><button class="quick-card" onclick="closeModal();openFixtureModal()"><b>▦ Fixture</b><span>Date, kickoff and match link</span></button><button class="quick-card" onclick="closeModal();openTicketModal()"><b>🎟 Ticket</b><span>Seat, buyer, card and margin</span></button></div>`)}

function openMembershipModal(id=''){

function saveMembership(id){
  const name=$('#m-name').value.trim(),type=$('#m-type').value.trim();if(!name&&!type){$('#m-name').focus();return}
  const old=state.memberships.find(x=>x.id===id)||{};
  const card=$('#m-card').value;
  const obj={...old,id:id||uid(),clubId:$('#m-club').value,memberName:name,type:type||'Membership',memberNumber:$('#m-number').value.trim(),tier:$('#m-tier').value.trim(),email:$('#m-email').value.trim(),renewalDate:$('#m-renew').value,cost:$('#m-cost').value,passwordHint:$('#m-hint').value.trim(),portalLink:$('#m-link').value.trim(),notes:$('#m-notes').value.trim(),groupIds:old.groupIds||[],paymentMethodIds:card?[card]:[]};
  const i=state.memberships.findIndex(x=>x.id===id);if(i>=0)state.memberships[i]=obj;else state.memberships.push(obj);save();closeModal();render();
}

function openGroupModal(id=''){
  ensureV6State();const g=state.groups.find(x=>x.id===id)||{clubId:clubFilter!=='all'?clubFilter:'liverpool',memberIds:[]};
  modal(`<div class="modalhead"><h3>${id?'Edit':'New'} Friends & Family group</h3><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>Club</label><select id="g-club" onchange="refreshGroupMembers()">${clubOptions(g.clubId)}</select></div><div class="field"><label>Group name</label><input id="g-name" value="${esc(g.name||'')}" placeholder="e.g. Ameen / Ayshah / Yasmin"></div><div class="field full"><label>Linked memberships</label><div id="g-members">${memberChecks(g.clubId,g.memberIds||[])}</div></div><div class="field full"><label>Club-side reference / note</label><input id="g-ref" value="${esc(g.reference||'')}" placeholder="Optional"></div><div class="field full"><label>Notes</label><textarea id="g-notes">${esc(g.notes||'')}</textarea></div></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveGroup('${id}')">Save group</button></div>`);

function refreshGroupMembers(){const el=$('#g-members');if(el)el.innerHTML=memberChecks($('#g-club').value,[])}
function saveGroup(id=''){const name=$('#g-name').value.trim();if(!name){$('#g-name').focus();return}const obj={id:id||uid(),clubId:$('#g-club').value,name,memberIds:selectedMembershipIds(),reference:$('#g-ref').value.trim(),notes:$('#g-notes').value.trim()};const i=state.groups.findIndex(x=>x.id===id);if(i>=0)state.groups[i]=obj;else state.groups.push(obj);state.memberships.forEach(m=>{m.groupIds=state.groups.filter(g=>(g.memberIds||[]).includes(m.id)).map(g=>g.id)});save();closeModal();render()}
function removeGroup(id){if(!confirm('Remove this Friends & Family group? Memberships will stay.'))return;state.groups=state.groups.filter(g=>g.id!==id);state.memberships.forEach(m=>m.groupIds=(m.groupIds||[]).filter(x=>x!==id));save();render()}

function openPaymentModal(id=''){
  ensureV6State();const p=state.paymentMethods.find(x=>x.id===id)||{clubId:clubFilter!=='all'?clubFilter:''};
  modal(`<div class="modalhead"><h3>${id?'Edit':'Add'} payment card</h3><button class="close" onclick="closeModal()">×</button></div><div class="v6-note" style="margin-bottom:12px">For safety, store only nickname, cardholder, last four digits and expiry. Do not enter a full card number, CVV or PIN.</div><div class="formgrid"><div class="field"><label>Card nickname</label><input id="p-name" value="${esc(p.nickname||'')}" placeholder="Monzo / Barclaycard / Ameen Visa"></div><div class="field"><label>Club assignment</label><select id="p-club"><option value="" ${!p.clubId?'selected':''}>All / general</option>${state.clubs.map(c=>`<option value="${c.id}" ${p.clubId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Cardholder</label><input id="p-holder" value="${esc(p.cardholder||'')}"></div><div class="field"><label>Last 4 digits</label><input id="p-last4" inputmode="numeric" maxlength="4" value="${esc(p.last4||'')}" placeholder="1234"></div><div class="field"><label>Expiry (MM/YY)</label><input id="p-expiry" value="${esc(p.expiry||'')}" placeholder="08/29"></div><div class="field"><label>Payment provider</label><input id="p-provider" value="${esc(p.provider||'')}" placeholder="Visa / Mastercard"></div><div class="field full"><label>Notes</label><textarea id="p-notes">${esc(p.notes||'')}</textarea></div></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePayment('${id}')">Save card</button></div>`);

function savePayment(id=''){const nickname=$('#p-name').value.trim(),last4=$('#p-last4').value.replace(/\D/g,'').slice(-4);if(!nickname){$('#p-name').focus();return}if(last4&&last4.length!==4){alert('Use exactly the last 4 digits only.');return}const obj={id:id||uid(),nickname,clubId:$('#p-club').value,cardholder:$('#p-holder').value.trim(),last4,expiry:$('#p-expiry').value.trim(),provider:$('#p-provider').value.trim(),notes:$('#p-notes').value.trim()};const i=state.paymentMethods.findIndex(x=>x.id===id);if(i>=0)state.paymentMethods[i]=obj;else state.paymentMethods.push(obj);save();closeModal();render()}
function removePayment(id){if(cardAssignments(id).length&&!confirm('This card is assigned to memberships. Remove it anyway?'))return;state.paymentMethods=state.paymentMethods.filter(p=>p.id!==id);state.memberships.forEach(m=>m.paymentMethodIds=(m.paymentMethodIds||[]).filter(x=>x!==id));state.ballots.forEach(b=>{if(b.paymentMethodId===id)b.paymentMethodId=''});state.tickets.forEach(t=>{if(t.paymentMethodId===id)t.paymentMethodId=''});save();render()}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
load();

// ---- PWA install + offline shell ----
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (event)=>{
  event.preventDefault();
  deferredInstallPrompt = event;
  if(localStorage.getItem('matchday-install-dismissed') !== '1') document.getElementById('install-banner')?.classList.add('show');
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  document.getElementById('install-banner')?.classList.remove('show');
});
function dismissInstall(){
  document.getElementById('install-banner')?.classList.remove('show');
  localStorage.setItem('matchday-install-dismissed','1');
}
async function installApp(){
  if(!deferredInstallPrompt){
    alert('Open this hosted app in Chrome, then use Chrome menu → Add to Home screen / Install app.');
    return;
  }
  deferredInstallPrompt.prompt();
  try{ await deferredInstallPrompt.userChoice; }catch(e){}
  deferredInstallPrompt = null;
  document.getElementById('install-banner')?.classList.remove('show');
}
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker registration failed',err)));
}
</script>
